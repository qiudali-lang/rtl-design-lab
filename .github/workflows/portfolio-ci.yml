name: portfolio-ci
on: [push, pull_request]

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python3 projects/pcie-rx/scripts/run_tests.py
      - run: python3 projects/pipeline-cpu/scripts/run_tests.py

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s projects/tomasulo/tests -v
      - run: python -m unittest discover -s projects/architecture-evaluation/tests -v
      - run: python projects/architecture-evaluation/scripts/run_demo.py
      - run: python -m unittest discover -s projects/custom-digital-circuits/tests -v
      - run: python projects/custom-digital-circuits/src/rc_delay.py
